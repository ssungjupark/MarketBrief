<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소비자행동론 실전 모의고사 3</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#17202b;--muted:#6b7280;--line:#dfe4ec;--blue:#2563eb;--blue2:#eaf1ff;--ok:#16803c;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:14px;line-height:1.6}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{background:#b91c1c;color:#fff;border-color:#b91c1c}.controls{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.exam{display:grid;grid-template-columns:240px 1fr;gap:16px}.side{position:sticky;top:12px;align-self:start}.timer{font-size:30px;font-weight:900;text-align:center}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.num{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff}.num.done{background:#e8f7ec}.num.cur{outline:2px solid var(--blue)}.qtitle{font-size:13px;color:var(--muted)}.stem{font-size:20px;font-weight:800;line-height:1.5;margin:14px 0 18px}.opt{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0;cursor:pointer}.opt.sel{border-color:var(--blue);background:var(--blue2)}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.score{font-size:36px;font-weight:900}.lecture{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.lec{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.wrong{border-top:1px solid var(--line);padding:14px 0}.good{color:var(--ok);font-weight:800}.bad{color:var(--bad);font-weight:800}@media(max-width:760px){.exam{grid-template-columns:1fr}.side{position:static}.lecture{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}.stem{font-size:18px}}</style></head><body><div class="wrap"><section id="start" class="card"><h1>소비자행동론 실전 모의고사 3</h1><p class="muted">50문항 · 5지선다 · 75분 · 제출 전 정답 비공개. 답안과 진행상황은 이 기기 브라우저에 자동저장됩니다.</p><div class="controls"><button id="newBtn" class="btn primary">새 시험 시작</button><button id="resumeBtn" class="btn hidden">이어 풀기</button><button id="resultBtn" class="btn hidden">이전 결과 보기</button></div></section><section id="exam" class="hidden"><div class="exam"><aside class="card side"><div class="muted" style="text-align:center">남은 시간</div><div id="timer" class="timer">75:00</div><div id="count" class="muted" style="text-align:center"></div><div id="nums" class="nums"></div><button id="submitBtn" class="btn danger" style="width:100%;margin-top:14px">시험 제출</button></aside><main class="card"><div id="qtitle" class="qtitle"></div><div id="stem" class="stem"></div><div id="options"></div><div class="nav"><button id="prev" class="btn">← 이전</button><button id="next" class="btn primary">다음 →</button></div></main></div></section><section id="result" class="card hidden"><div class="top"><div><div class="muted">채점 결과</div><div id="score" class="score"></div></div><div class="controls"><button id="again" class="btn primary">다시 풀기</button><button id="home" class="btn">처음 화면</button></div></div><div id="lecture" class="lecture"></div><h2>오답</h2><div id="wrongList"></div></section></div><script src="questions.js"></script><script>const Q=window.QUESTIONS||[];const AK='cbt_share_active_v1',RK='cbt_share_result_v1';let s=null,tick=null;const $=x=>document.querySelector(x);function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fmt(x){x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}function parse(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function save(){if(!s)return;try{localStorage.setItem(AK,JSON.stringify(s))}catch(e){}}function make(){const order=sh(Q.map(x=>x.id)),oo={};Q.forEach(x=>oo[x.id]=sh(x.o.map((_,i)=>i)));return{order,oo,ans:{},cur:0,start:Date.now(),end:Date.now()+75*60*1000}}function byId(id){return Q.find(x=>x.id===id)}function rem(){return Math.max(0,Math.ceil((s.end-Date.now())/1000))}function refreshStart(){$('#resumeBtn').classList.toggle('hidden',!(parse(AK)&&parse(AK).end>Date.now()));$('#resultBtn').classList.toggle('hidden',!parse(RK))}function show(id){['start','exam','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}function startNew(){const a=parse(AK);if(a&&Object.keys(a.ans||{}).length&&!confirm('진행 중 시험이 있습니다. 새로 시작할까요?'))return;s=make();save();openExam()}function resume(){s=parse(AK);if(!s||s.end<=Date.now()){if(s)submit(true);else show('start');return}openExam()}function openExam(){show('exam');buildNums();render();updateTimer();clearInterval(tick);tick=setInterval(updateTimer,1000)}function buildNums(){const n=$('#nums');n.innerHTML='';s.order.forEach((id,i)=>{const b=document.createElement('button');b.className='num';b.textContent=i+1;b.onclick=()=>{s.cur=i;save();render()};n.appendChild(b)});updateNums()}function updateNums(){[...document.querySelectorAll('.num')].forEach((b,i)=>{const id=s.order[i];b.className='num'+(s.ans[id]!==undefined?' done':'')+(i===s.cur?' cur':'')});$('#count').textContent='응답 '+Object.keys(s.ans).length+' / 50'}function render(){const id=s.order[s.cur],q=byId(id);$('#qtitle').textContent=(s.cur+1)+' / 50 · '+q.l;$('#stem').textContent=q.q;const box=$('#options');box.innerHTML='';s.oo[id].forEach((oi,k)=>{const lab=document.createElement('label');lab.className='opt'+(s.ans[id]===oi?' sel':'');const r=document.createElement('input');r.type='radio';r.name='opt';r.checked=s.ans[id]===oi;r.onchange=()=>{s.ans[id]=oi;save();render()};const tx=document.createElement('div');tx.innerHTML='<b>'+String.fromCharCode(65+k)+'.</b> '+esc(q.o[oi]);lab.append(r,tx);box.appendChild(lab)});$('#prev').disabled=s.cur===0;$('#next').textContent=s.cur===49?'마지막 문항':'다음 →';updateNums()}function updateTimer(){const r=rem();$('#timer').textContent=fmt(r);if(r<=0){clearInterval(tick);submit(true)}}function grade(){let c=0,ls={},wrong=[];s.order.forEach((id,idx)=>{const q=byId(id),ok=s.ans[id]===q.a;if(!ls[q.l])ls[q.l]={c:0,t:0};ls[q.l].t++;if(ok){c++;ls[q.l].c++}else wrong.push({idx:idx+1,id,sel:s.ans[id]})});return{score:c,ls,wrong,submitted:Date.now(),elapsed:Math.min(4500,Math.max(0,Math.round((Date.now()-s.start)/1000)))}}function submit(auto=false){if(!s)return;if(!auto){const u=50-Object.keys(s.ans).length;if(!confirm(u?('미응답 '+u+'문항이 있습니다. 제출할까요?'):'제출할까요?'))return}const r=grade();try{localStorage.setItem(RK,JSON.stringify(r));localStorage.removeItem(AK)}catch(e){}clearInterval(tick);showResult(r)}function showResult(r){show('result');$('#score').textContent=r.score+' / 50 ('+(r.score*2)+'%)';const lg=$('#lecture');lg.innerHTML='';Object.keys(r.ls).sort((a,b)=>+a.slice(1)-+b.slice(1)).forEach(k=>{const v=r.ls[k],d=document.createElement('div');d.className='lec';d.innerHTML='<b>'+k+'</b><br>'+v.c+'/'+v.t;lg.appendChild(d)});const wl=$('#wrongList');wl.innerHTML='';if(!r.wrong.length){wl.innerHTML='<div class="good">오답 없음</div>';return}r.wrong.forEach(w=>{const q=byId(w.id),d=document.createElement('div');d.className='wrong';d.innerHTML='<div class="muted">'+w.idx+'번 · '+q.l+'</div><div style="font-weight:800;margin:5px 0">'+esc(q.q)+'</div><div class="bad">내 답: '+esc(w.sel===undefined?'미응답':q.o[w.sel])+'</div><div class="good">정답: '+esc(q.o[q.a])+'</div>';wl.appendChild(d)})}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('#newBtn').onclick=startNew;$('#resumeBtn').onclick=resume;$('#resultBtn').onclick=()=>{const r=parse(RK);if(r)showResult(r)};$('#prev').onclick=()=>{if(s.cur>0){s.cur--;save();render()}};$('#next').onclick=()=>{if(s.cur<49){s.cur++;save();render()}};$('#submitBtn').onclick=()=>submit(false);$('#again').onclick=startNew;$('#home').onclick=()=>{show('start');refreshStart()};window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});refreshStart();</script></body></html>
