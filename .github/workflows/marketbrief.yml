name: MarketBrief Daily

on:
  schedule:
    # Korea close: 16:30 KST, then two fallbacks
    - cron: '30 07 * * 1-5'
    - cron: '46 07 * * 1-5'
    - cron: '00 08 * * 1-5'
    # U.S. close: 06:30 KST, then two fallbacks
    - cron: '30 21 * * 1-5'
    - cron: '46 21 * * 1-5'
    - cron: '00 22 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'Report market'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US
      delivery_guard:
        description: 'Suppress duplicate delivery for this market/date'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/marketbrief.yml'

permissions:
  contents: read

concurrency:
  group: marketbrief-daily
  cancel-in-progress: false

jobs:
  bootstrap-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
      - name: Check required GitHub Actions secrets
        shell: bash
        run: |
          missing=()
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID KRX_ID KRX_PW; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required GitHub Actions secrets are configured."

  deliver:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      REQUIRE_KRX_DATA: 'true'
      REPORT_FORMAT_CONFIG: config/report_formats.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve report context
        id: context
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            MARKET="${{ inputs.market }}"
            GUARD="${{ inputs.delivery_guard }}"
          else
            case "${{ github.event.schedule }}" in
              '30 07 * * 1-5'|'46 07 * * 1-5'|'00 08 * * 1-5') MARKET='KR' ;;
              *) MARKET='US' ;;
            esac
            GUARD='true'
          fi

          SESSION_DATE=$(TZ=Asia/Seoul date +%F)
          CACHE_KEY="marketbrief-sent-v1-${MARKET}-${SESSION_DATE}"

          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "guard=$GUARD" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "Resolved market=$MARKET session=$SESSION_DATE"

      - name: Restore delivery guard
        if: steps.context.outputs.guard == 'true'
        id: sent-cache
        uses: actions/cache/restore@v4
        with:
          path: .marketbrief-delivery
          key: ${{ steps.context.outputs.cache_key }}

      - name: Set up Python
        if: steps.sent-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        if: steps.sent-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Install dependencies
        if: steps.sent-cache.outputs.cache-hit != 'true'
        run: uv sync --frozen --no-dev

      - name: Run MarketBrief
        if: steps.sent-cache.outputs.cache-hit != 'true'
        env:
          DELIVERY_RECEIPT_PATH: .marketbrief-delivery/sent
          REPORT_MARKET: ${{ steps.context.outputs.market }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            uv run --frozen python src/render_main.py 2>&1 | tee marketbrief.log
          else
            uv run --frozen python src/main.py --market "$REPORT_MARKET" 2>&1 | tee marketbrief.log
          fi

      - name: Save delivery guard
        if: always() && steps.context.outputs.guard == 'true' && steps.sent-cache.outputs.cache-hit != 'true' && hashFiles('.marketbrief-delivery/sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .marketbrief-delivery
          key: ${{ steps.context.outputs.cache_key }}

      - name: Upload run log
        if: always() && steps.sent-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: marketbrief-artifacts-${{ github.run_id }}
          path: |
            marketbrief.log
            macro_pulse_report.html
          if-no-files-found: ignore
